<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gacha Simulator</title><style>:root{--bg:#eaf1fb;--panel:#ffffff;--ink:#25324a;--muted:#7787a2;--line:#dbe4f2;--accent:#3aa0ff;--accent2:#2b7fe0;--r1:#9aa5b1;--r2:#4aa8e0;--r3:#f4b942;--pu:#ff6fae;--pu2:#ffd36f;--shadow:0 6px 20px rgba(43,88,160,.12)}*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:"Segoe UI","Malgun Gothic","Yu Gothic",system-ui,-apple-system,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#f6faff,var(--bg));color:var(--ink);min-height:100vh;padding:18px}.wrap{max-width:1080px;margin:0 auto}h1{font-size:22px;margin:0}.tagline{color:var(--muted);font-size:13px;margin-top:2px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spacer{flex:1}button{font-family:inherit;cursor:pointer}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:11px;font-size:14px;font-weight:600;transition:.12s;box-shadow:0 1px 2px rgba(0,0,0,.03)}.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent2)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));border:none;color:#fff}.btn.primary:hover:not(:disabled){filter:brightness(1.05);color:#fff}.btn.pull{background:linear-gradient(180deg,#2fd08f,#12a06f);border:none;color:#fff;box-shadow:0 2px 8px rgba(18,160,111,.35)}.btn.pull:hover:not(:disabled){filter:brightness(1.06);color:#fff}.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}.seg{display:inline-flex;background:#eef3fb;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}.seg button{border:none;background:transparent;padding:7px 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}.seg button.active{background:#fff;color:var(--accent2);box-shadow:0 1px 4px rgba(0,0,0,.08)}.seg.rng{border-color:#f2b24a;background:#fdf1de -content:center;font-weight:800;font-size:14px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12);padding:0 6px}.cell.r1{background:linear-gradient(160deg,#b6c0cd,var(--r1));color:#3a4658}.cell.r2{background:linear-gradient(160deg,#74c4f0,var(--r2))}.cell.r3{background:linear-gradient(160deg,#ffd873,var(--r3));color:#6b4b00}.cell.pu{background:linear-gradient(160deg,var(--pu2),var(--pu));box-shadow:0 0 12px rgba(255,111,174,.55)}.cell.fpu{background:linear-gradient(160deg,#b98cff,#8a5cf6);box-shadow:0 0 12px rgba(138,92,246,.55)}.cell.fnp{background:linear-gradient(160deg,#ffc46b,#ff9a3d);color:#5a3200}.cell.bonuscell{outline:2px dashed rgba(255,255,255,.7);outline-offset:-4px}.tag{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;font-weight:800;background:#25324a;color:#fff;padding:1px 5px;border-radius:6px}.ph{color:var(--muted);font-size:13px;padding:12px 4px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}.panels .stats{grid-template-columns:repeat(2,1fr)}.stat{background:#f6f9fe;border:1px solid var(--line);border-radius:11px;padding:9px 10px;text-align:center}.stat-v{font-size:19px;font-weight:800}.stat-k{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}.stat.pu .stat-v{color:var(--pu)}.stat.r3 .stat-v{color:#d99b00}.stat.r2 .stat-v{color:var(--r2)}.stat.r1 .stat-v{color:var(--r1)}.stat.elig .stat-v{color:#38b48b}.stat.spent .stat-v{color:#7787a2}.stat.fpu .stat-v{color:#8a5cf6}.stat.fnp .stat-v{color:#e07b1f}.subttl{font-weight:700;font-size:13px;margin:0 0 8px;color:var(--ink)}.history{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:11px;padding:6px;background:#fbfdff}.hitem{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 7px;border-radius:8px}.hitem:nth-child(odd){background:#f3f7fd}.dot{width:10px;height:10px;border-radius:50%;flex:none}.dot.r3{background:var(--r3)}.dot.pu{background:var(--pu)}.dot.r1{background:var(--r1)}.dot.r2{background:var(--r2)}.dot.fpu{background:#8a5cf6}.dot.fnp{background:#ff9a3d}.colwrap{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-top:12px}@media(max-width:680px){.colwrap{grid-template-columns:1fr}}.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#e8477a;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1;top:28px}[hidden]{display:none!important}</style></head><body><div class="wrap"><div id="setup" class="card"><div class="row"><div><h1 id="s_title">가챠 시뮬레이터</h1><div class="tagline" data-i18n="tagline"></div></div><div class="spacer"></div><div class="seg lang"><button data-lang="kr">KR</button><button data-lang="jp">JP</button><button data-lang="en">EN</button></div></div><div class="field"><label data-i18n="setupTitle"></label><div class="note" data-i18n="setupHint" style="margin-bottom:8px"></div><div class="curinput"><input type="number" id="setupInput" min="0" value="12000"><span class="chip" data-i18n="pyroxene"></span></div></div><div class="field"><button class="btn primary" id="startBtn" data-i18n="startBtn" style="width:100%"></button></div></div><div id="app" hidden><div class="card"><div class="row"><div><h1 data-i18n="title"></h1><div class="tagline" data-i18n="tagline"></div></div><div class="spacer"></div><div class="seg lang"><button data-lang="kr">KR</button><button data-lang="jp">JP</button><button data-lang="en">EN</button></div></div><div class="row" style="margin-top:14px"><div class="owned"><span class="lbl"><span data-i18n="ownedLabel"></span> · <span data-i18n="pyroxene"></span></span><input type="number" id="ownedInput" min="0"></div><div class="row topups"><button class="btn sm" data-add="1200">+1,200</button><button class="btn sm" data-add="24000">+24,000</button></div><span class="note" data-i18n="costNote"></span><div class="spacer"></div><span class="note" data-i18n="bannerLabel"></span><div class="seg" id="bannerSeg"><button data-banner="normal" data-i18n="bannerNormal"></button><button data-banner="fes" data-i18n="bannerFes"></button></div></div><div class="row" style="margin-top:8px"><span class="note" id="bannerHint" style="color:#b5477e;font-weight:600"></span></div></div><div id="compareMode"><div class="card"><div class="row"><span class="note rnglbl" data-i18n="rngLabel"></span><div class="seg rng" id="rngSeg"><button data-rng="shared" data-i18n="rngShared"></button><button data-rng="indep" data-i18n="rngIndep"></button></div><span class="note" id="rngHint"></span><div class="spacer"></div><button class="btn pull" id="cmp-pull1" data-i18n="pullBoth1"></button><button class="btn pull" id="cmp-pull10" data-i18n="pullBoth10"></button><button class="btn sm" id="cmp-reset" data-i18n="resetBoth"></button></div></div><div class="panels"><div class="card pA"><div class="ptitle" data-i18n="policyOldName"></div><div class="pity" id="cmp-old-pity"></div><div class="pdesc" id="cmp-old-desc"></div><div class="results" id="cmp-old-results"></div><div class="subttl" style="margin-top:14px" data-i18n="statsTitle"></div><div class="stats" id="cmp-old-stats"></div><div class="subttl" style="margin-top:14px" data-i18n="historyTitle"></div><div class="history" id="cmp-old-history"></div></div><div class="card pB"><div class="ptitle" data-i18n="policyNewName"></div><div class="pity" id="cmp-new-pity"></div><div class="pdesc" id="cmp-new-desc"></div><div class="results" id="cmp-new-results"></div><div class="subttl" style="margin-top:14px" data-i18n="statsTitle"></div><div class="stats" id="cmp-new-stats"></div><div class="subttl" style="margin-top:14px" data-i18n="historyTitle"></div><div class="history" id="cmp-new-history"></div></div></div></div></div></div><div class="toast" id="toast"></div><script>const I18N = { en:{ title:'Gacha Pull Simulator', tagline:'Pity policy A/B comparison', setupTitle:'Set your s 10:'10회 뽑기', pullBoth1:'1회 뽑기 (양쪽)', pullBoth10:'10회 뽑기 (양쪽)', statsTitle:'통계', historyTitle:'히스토리 (3성 / 픽업)', historyEmpty:'아직 3성 또는 픽업이 없습니다.', reset:'통계 초기화', resetBoth:'양쪽 초기화', puName:'픽업', totalPulls:'총 뽑기', spent:'사용량', notEnough:'청휘석이 부족합니다!', rngLabel:'난수', rngShared:'공유 난수', rngIndep:'독립 난수', rngSharedHint:'양쪽에 동일한 주사위 — 정책 차이만 비교됩니다.', rngIndepHint:'각 정책이 독립적으로 뽑습니다.', pity:'천장', pity100:'천장 100', pity200:'천장 200', bonus:'천장 보너스', guaranteed:'10연 확정', pullToBegin:'뽑기를 시작하세요.', selectPolicy:'정책:', bannerLabel:'배너:', bannerNormal:'일반', bannerFes:'FES', fesPuName:'FES 픽업', fesNonName:'FES 3성 (비픽업)', fesRatesHint:'FES 적용 · 3성급 6.0% (3성 4.4% · FES 픽업 0.7% · FES 비픽업 0.9%)' }, jp:{ title:'ガチャシミュレーター', tagline:'天井ポリシー A/B 比較', setupTitle:'開始時の所持数を設定', setupHint:'現在の所持数を入力してください。後でいつでも変更できます。', startBtn:'スタート', pyroxene:'青輝石', eligmaCur:'神名のカケラ', ownedLabel:'所持', costNote:'1回120', modeSingle:'単一', modeCompare:'A/B比較', policyOldName:'A · 200回ボーナス', policyNewName:'B · 100/200累積', policyOldDesc:'200回ごとに追加のピックアップを確定で付与し、カウンターをリセット。運でピックアップが出てもカウンターはリセットされません。', policyNewDesc:'カウンター100で50% 3★ / 50% ピックアップ、カウンター200でピックアップ確定。ピックアップ(運・天井問わず)を引くとカウンターがリセットされます。', pull1:'1回引く', pull10:'10回引く', pullBoth1:'1回引く (両方)', pullBoth10:'10回引く (両方)', statsTitle:'統計', historyTitle:'履歴 (3★ / ピックアップ)', historyEmpty:'まだ3★・ピックアップはありません。', reset:'統計をリセット', resetBoth:'両方リセット', puName:'ピックアップ', totalPulls:'総回数', spent:'使用量', notEnough:'青輝石が足りません！', rngLabel:'乱数', rngShared:'共有ロール', rngIndep:'独立ロール', rngSharedHint:'両方に同じサイコロ — ポリシー差のみ比較。', rngIndepHint:'各ポリシーが独立して引きます。', pity:'天井', pity100:'天井100', pity200:'天井200', bonus:'天井ボーナス', guaranteed:'10連確定', pullToBegin:'引いて始めましょう。', selectPolicy:'ポリシー:', bannerLabel:'バナー:', bannerNormal:'通常', bannerFes:'FES', fesPuName:'FESピックアップ', fesNonName:'FES 3★ (非PU)', fesRatesHint:'FES適用 · 3★級 6.0% (3★ 4.4% · FES PU 0.7% · FES非PU 0.9%)' } }; const COST = 120; const ELIGMA = {'1star':1,'2star':10,'3star':50,'pickup':50,'fespickup':50,'fesnonpickup':50}; const RAR = { '1star':{cls:'r1',label:'1★'}, '2star':{cls:'r2',label:'2★'}, '3star':{cls:'r3',label:'3★'}, 'pickup':{cls:'pu',label:'PU'}, 'fespickup':{cls:'fpu',label:'F·PU'}, 'fesnonpickup':{cls:'fnp',label:'F·3★'} }; function baseFromRoll(r, banner){ if(banner==='fes'){ if(r < 0.755) return '1star'; if(r < 0.940) return '2star'; if(r < 0.984) return '3star'; if(r < 0.993) return 'fesnonpickup'; return 'fespickup'; } if(r < 0.785) return '1star'; if(r < 0.970) return '2star'; if(r < 0.993) return '3star'; return 'pickup'; } const LANG_KEY='gs_lang'; let LANG = localStorage.getItem(LANG_KEY) || 'kr'; let owned = 0; let rngMode = 'shared'; let banner = localStorage.getItem('gs_banner') || 'normal'; function makeState(policy){ return { policy, counter:0, total:0, stats:{s1:0,s2:0,s3:0,pu:0,fp:0,fn:0,eligma:0}, history:[] }; } const compare = { old:makeState('old'), new:makeState('new') }; const lastCompare = { old:null, new:null }; const t = k => I18N[LANG][k]; const fmt = n => n.toLocaleString(); const $ = id => document.getElementById(id); const STATKEY = {'1star':'s1','2star':'s2','3star':'s3','pickup':'pu','fespickup':'fp','fesnonpickup':'fn'}; function commitStat(st, type){ st.stats[STATKEY[type]]++; st.stats.eligma += ELIGMA[type]; } function processBatch(st, n, provider, pickupType){ const isPickup = ty => (ty==='pickup' || ty==='fespickup'); const pulls = []; for(let i=0;i<n;i++){ const {base, pityR} = provider(i); st.total++; st.counter++; let type = base, badge = null, bonus = false, bonusType = null; if(st.policy==='new'){ if(st.counter===100){ type = (pityR<0.5) ? pickupType : '3star'; badge='pity100'; } else if(st.counter===200){ type = pickupType; badge='pity200'; } } commitStat(st, type); if(type!=='1star' && type!=='2star') st.history.push({trial:st.total, type, badge}); if(st.policy==='old'){ if(st.counter===200){ bonus = true; bonusType = pickupType; commitStat(st, pickupType); st.history.push({trial:st.total, type:pickupType, badge:'bonus'}); st.counter = 0; } } else { if(isPickup(type)) st.counter = 0; } pulls.push({trial:st.total, type, badge, bonus, bonusType}); } if(n===10 && pulls.every(p=>p.type==='1star')){ const last = pulls[n-1]; st.stats.s1--; st.stats.eligma -= ELIGMA['1star']; st.stats.s2++; st.stats.eligma += ELIGMA['2star']; last.type = '2star'; last.guaranteed = true; } return pulls; } function doComparePull(n){ const cost = n*COST; if(owned < cost){ toast(t('notEnough')); return; } owned -= cost; const pu = banner==='fes' ? 'fespickup' : 'pickup'; if(rngMode==='shared'){ const rolls = []; for(let i=0;i<n;i++) rolls.push({ r:Math.random(), r2:Math.random() }); lastCompare.old = processBatch(compare.old, n, i => ({ base:baseFromRoll(rolls[i].r, banner), pityR:rolls[i].r2 }), pu); lastCompare.new = processBatch(compare.new, n, i => ({ base:baseFromRoll(rolls[i].r, banner), pityR:rolls[i].r2 }), pu); } else { lastCompare.old = processBatch(compare.old, n, () => ({ base:baseFromRoll(Math.random(), banner), pityR:Math.random() }), pu); lastCompare.new = processBatch(compare.new, n, () => ({ base:baseFromRoll(Math.random(), banner), pityR:Math.random() }), pu); } render(); } function typeName(type){ if(type==='pickup') return t('puName'); if(type==='fespickup') return t('fesPuName'); if(type==='fesnonpickup') return t('fesNonName'); return RAR[type].label; } function histLine(e){ let badge = ''; if(e.badge==='pity100') badge = ' · '+t('pity100'); else if(e.badge==='pity200') badge = ' · '+t('pity200'); else if(e.badge==='bonus') badge = ' · '+t('bonus'); const prefix = LANG==='en' ? ('#'+e.trial) : LANG==='kr' ? (e.trial+'회차') : (e.trial+'回目'); return prefix+' : '+typeName(e.type)+badge; } function pityText(st){ if(st.policy==='old') return t('pity')+': <b>'+st.counter+'</b> / 200'; return t('pity')+': <b>'+st.counter+'</b> → 100 / 200'; } function renderResults(pulls, el){ if(!pulls){ el.innerHTML = '<div class="ph">'+t('pullToBegin')+'</div>'; return; } let html=''; for(const p of pulls){ const r = RAR[p.type]; let tag=''; if(p.guaranteed) tag = '<span class="tag">'+t('guaranteed')+'</span>'; else if(p.badge) tag = '<span class="tag">'+t(p.badge)+'</span>'; html += '<div class="cell '+r.cls+'">'+r.label+tag+'</div>'; if(p.bonus){ const br=RAR[p.bonusType]; html += '<div class="cell '+br.cls+' bonuscell">'+br.label+'<span class="tag">'+t('bonus')+'</span></div>'; } } el.innerHTML = html; } function renderStats(st, el){ const s = st.stats; const showFes = banner==='fes' || (s.fp + s.fn) > 0; const cards = []; if(showFes) cards.push(['fpu', t('fesPuName'), s.fp], ['fnp', t('fesNonName'), s.fn]); if(!showFes || s.pu>0) cards.push(['pu', t('puName'), s.pu]); cards.push(['r3','3★', s.s3], ['r2','2★', s.s2], ['r1','1★', s.s1], ['', t('totalPulls'), st.total], ['elig', t('eligmaCur'), s.eligma], ['spent', t('spent'), st.total*COST]); el.innerHTML = cards.map(c => '<div class="stat '+c[0]+'"><div class="stat-v">'+fmt(c[2])+'</div><div class="stat-k">'+c[1]+'</div></div>' ).join(''); } function renderHistory(st, el){ if(!st.history.length){ el.innerHTML = '<div class="ph">'+t('historyEmpty')+'</div>'; return; } el.innerHTML = st.history.slice().reverse().map(e => '<div class="hitem"><span class="dot '+RAR[e.type].cls+'"></span>'+histLine(e)+'</div>' ).join(''); } function applyLang(){ document.documentElement.lang = LANG==='kr'?'ko':LANG; document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n)); $('s_title').textContent = t('title'); document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang===LANG)); } function render(){ applyLang(); if(document.activeElement !== $('ownedInput')) $('ownedInput').value = owned; document.querySelectorAll('#bannerSeg button').forEach(b => b.classList.toggle('active', b.dataset.banner===banner)); $('bannerHint').textContent = banner==='fes' ? t('fesRatesHint') : ''; const canPull = owned >= COST; const canPull10= owned >= COST*10; document.querySelectorAll('#rngSeg button').forEach(b => b.classList.toggle('active', b.dataset.rng===rngMode)); $('rngHint').textContent = rngMode==='shared' ? t('rngSharedHint') : t('rngIndepHint'); $('cmp-pull1').disabled = !canPull; $('cmp-pull10').disabled = !canPull10; $('cmp-old-desc').textContent = t('policyOldDesc'); $('cmp-new-desc').textContent = t('policyNewDesc'); $('cmp-old-pity').innerHTML = pityText(compare.old); $('cmp-new-pity').innerHTML = pityText(compare.new); renderResults(lastCompare.old, $('cmp-old-results')); renderResults(lastCompare.new, $('cmp-new-results')); renderStats(compare.old, $('cmp-old-stats')); renderStats(compare.new, $('cmp-new-stats')); renderHistory(compare.old, $('cmp-old-history')); renderHistory(compare.new, $('cmp-new-history')); } let toastTimer=null; function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1600); } function resetState(st){ Object.assign(st, makeState(st.policy)); } document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { LANG = b.dataset.lang; localStorage.setItem(LANG_KEY, LANG); applyLang(); if(!$('app').hidden) render(); })); $('startBtn').addEventListener('click', () => { owned = Math.max(0, Math.floor(+$('setupInput').value || 0)); $('setup').hidden = true; $('app').hidden = false; render(); }); $('ownedInput').addEventListener('input', () => { owned = Math.max(0, Math.floor(+$('ownedInput').value || 0)); render(); }); document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => { owned += +b.dataset.add; render(); })); $('rngSeg').addEventListener('click', e => { const b=e.target.closest('button'); if(!b)return; rngMode=b.dataset.rng; render(); }); $('bannerSeg').addEventListener('click', e => { const b=e.target.closest('button'); if(!b)return; banner=b.dataset.banner; localStorage.setItem('gs_banner', banner); render(); }); $('cmp-pull1').addEventListener('click', ()=>doComparePull(1)); $('cmp-pull10').addEventListener('click', ()=>doComparePull(10)); $('cmp-reset').addEventListener('click', ()=>{ resetState(compare.old); resetState(compare.new); lastCompare.old=lastCompare.new=null; render(); }); applyLang();</script></body></html>
